# Replace geometry and camera metadata with measured values before a real experiment.
schema_version: 1
manifest_path: ../data/raw/manifest.json
mode: rgb
metric_scale_source: measured_geometry
camera_motion: moving
surface_frame_id: measured_patch_A
surface_method: pnp
horizon_sec: 0.2
timestamp_tolerance_sec: 0.04
max_reprojection_error_px: 4.0
min_keypoint_confidence: 0.5
tracking: true
seed: 42
tool:
  origin_key: tip
  axis_from: axis_base
  axis_to: tip
  x_key: side
  points_m:
    tip: [0.0, 0.0, 0.0]
    axis_base: [0.0, 0.0, -0.07]
    side: [0.04, 0.0, 0.0]
    top: [0.0, 0.03, 0.0]
    rear_left: [-0.03, -0.025, -0.05]
    rear_right: [0.03, -0.025, -0.05]
    back_top: [0.0, 0.025, -0.06]
    front_left: [-0.03, -0.02, 0.0]
surface:
  points_m:
    bottom_left: [-0.35, -0.25, 0.0]
    bottom_right: [0.35, -0.25, 0.0]
    top_right: [0.35, 0.25, 0.0]
    top_left: [-0.35, 0.25, 0.0]
