[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "robodata"
version = "0.1.0"
description = "Video-derived surface-relative tool trajectories and action labels"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11", "opencv-python-headless>=4.10,<5",
  "pydantic>=2.7,<3", "PyYAML>=6", "matplotlib>=3.8"
]

[project.optional-dependencies]
learning = ["torch>=2.2"]
vggt = [
  "torch>=2.3", "torchvision>=0.18", "Pillow", "huggingface_hub", "einops", "safetensors",
  "vggt @ git+https://github.com/facebookresearch/vggt.git@a288dd0f14786c93483e45524328726ab7b1b4ce"
]
yolo = ["ultralytics==8.4.78", "lap==0.5.12"]
hand = ["mediapipe==0.10.21", "numpy>=1.26,<2", "opencv-python-headless==4.11.0.86"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
robodata = "robodata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]
